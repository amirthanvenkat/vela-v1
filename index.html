<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1B2D4F" />
<title>VELA · Your money, moving.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>" />

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

<!-- Tailwind Play CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          midnight: '#1B2D4F',
          coral: '#FF6B6B',
          blush: '#FFF8F5',
          leaf: '#4CAF82',
          deepnavy: '#0D1B2A',
          charcoal: '#1C1C1C',
          slate2: '#7A8899',
        },
        fontFamily: {
          serif: ['Fraunces', 'serif'],
          sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
          mono: ['"DM Mono"', 'ui-monospace', 'monospace'],
        },
      },
    },
  };
</script>

<!-- React + ReactDOM + Framer Motion + Babel (single-file build, no bundler needed) -->
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/framer-motion@11.11.17/dist/framer-motion.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #0a0f17;
    overflow: hidden;
  }
  #root { height: 100%; }
  /* Hide scrollbars but keep scroll */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .num { font-family: 'DM Mono', monospace; font-feature-settings: "tnum"; }
  /* Bottom spacing that clears the home indicator (framed) or the device safe area (phone) */
  .pb-safe { padding-bottom: max(32px, calc(var(--safe-bottom, 0px) + 16px)); }
  .pb-nav { padding-bottom: calc(var(--safe-bottom, 0px) + 104px); }
  /* Keyboard focus */
  button:focus-visible, [role="button"]:focus-visible, input:focus-visible {
    outline: 2px solid #FF6B6B; outline-offset: 2px;
  }
  /* Loading shimmer */
  .boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #1B2D4F; color: #FFF8F5; font-family: 'Fraunces', serif; font-size: 34px;
    letter-spacing: 0.18em; text-indent: 0.18em; z-index: 9999; transition: opacity .4s ease;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <div class="boot" id="boot">VELA</div>

  <script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, createContext, useContext, useMemo } = React;
const { motion, AnimatePresence, MotionConfig, useReducedMotion } = window.Motion;

/* ----------------------------------------------------------------------------
   VELA: a single-file mobile banking & investing prototype.
   React + Tailwind + Framer Motion. No backend; all state is mocked and kept
   in localStorage so a refresh doesn't lose your garden.
---------------------------------------------------------------------------- */

/* ---------- Data ---------- */
const FLOWERS = ['🌸', '🌺', '🌻', '🌼', '💐'];
const MIN_INVEST = 10;

const RISKS = {
  tortoise: { key: 'tortoise', emoji: '🐢', label: 'Tortoise', vibe: 'Play it safe', profile: 'Steady' },
  fox:      { key: 'fox',      emoji: '🦊', label: 'Fox',      vibe: 'Balanced',     profile: 'Balanced' },
  rocket:   { key: 'rocket',   emoji: '🚀', label: 'Rocket',   vibe: 'Go bold',      profile: 'Adventurous' },
};

const ARTICLES = {
  investing: {
    icon: '🌱',
    title: 'What is investing?',
    blurb: 'What it means to put your money to work.',
    body: [
      "Investing means using some of your money to buy small slices of companies and other assets that tend to grow in value over time.",
      "Instead of sitting still in your account, your money goes to work and can earn a little more over time. That growth is the point of it.",
      "You don't need to be rich or clever to start. SGD 50 is enough to plant your first flower. Small, regular amounts add up more than you'd think.",
      "What matters most is starting early and staying calm. Given enough time, even small amounts can grow a long way.",
    ],
  },
  risk: {
    icon: '🦊',
    title: 'What is risk?',
    blurb: 'Why a balanced choice suits most beginners.',
    body: [
      "Risk is a word for how bumpy the ride might be. Some choices stay steady. Others move up and down a lot from one day to the next.",
      "A steadier choice grows more slowly but feels calm. A bolder choice can grow faster, though you'll see bigger ups and downs along the way.",
      "For most people starting out, a balanced choice in the middle tends to feel comfortable. It grows enough to matter without too many sharp swings.",
      "Whatever you pick, the dips are normal. They happen to everyone and rarely mean you did anything wrong.",
    ],
  },
  money: {
    icon: '💸',
    title: 'Where does my money go?',
    blurb: 'Plain language, no jargon.',
    body: [
      "When you invest through Vela, your money is spread across many well-known companies and assets, so it never rides on a single bet.",
      "Spreading it out like this is called diversifying. It just means you don't put all your eggs in one basket, which softens the bumps.",
      "Your money is never locked away. You can take it out whenever you like, and you'll always see exactly how much you have.",
      "Every flower in your garden stands for a real piece of your money as it grows.",
    ],
  },
};

/* ---------- Themes (CSS variables) ---------- */
const THEMES = {
  light: {
    label: 'Light', swatch: '#FFF8F5',
    vars: { '--bg': '#FFF8F5', '--card': '#FFFFFF', '--text': '#1C1C1C', '--subtle': '#7A8899',
            '--navy': '#1B2D4F', '--border': '#ECE3DD', '--soft': '#FBEEE8' },
  },
  dark: {
    label: 'Dark', swatch: '#0D1B2A',
    vars: { '--bg': '#0D1B2A', '--card': '#15273C', '--text': '#FFF8F5', '--subtle': '#92A1B4',
            '--navy': '#15273C', '--border': '#24364E', '--soft': '#1A2E45' },
  },
  moss: {
    label: 'Moss', swatch: '#0E1F17',
    vars: { '--bg': '#0E1F17', '--card': '#163022', '--text': '#EAF5EE', '--subtle': '#86AC95',
            '--navy': '#163022', '--border': '#244A33', '--soft': '#1B3A28' },
  },
};

/* ---------- App context ---------- */
const AppCtx = createContext(null);
const useApp = () => useContext(AppCtx);

const fmt = (n) => n.toLocaleString('en-SG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// "Just now", "12 min ago", "Today, 14:05", "3 Oct"
function when(at) {
  const diff = Date.now() - at;
  if (diff < 60e3) return 'Just now';
  if (diff < 3600e3) return `${Math.floor(diff / 60e3)} min ago`;
  const d = new Date(at);
  if (d.toDateString() === new Date().toDateString()) {
    return 'Today, ' + d.toLocaleTimeString('en-SG', { hour: '2-digit', minute: '2-digit', hour12: false });
  }
  return d.toLocaleDateString('en-SG', { day: 'numeric', month: 'short' });
}

/* ---------- Tiny UI primitives ---------- */

// Glassy "3D" icon bubble approximating polished glass icons.
function IconBubble({ children, size = 64, tone = 'coral', className = '' }) {
  const tones = {
    coral: 'radial-gradient(120% 120% at 30% 25%, #ffd0c4 0%, #ff8f7e 45%, #ff5a5a 100%)',
    leaf:  'radial-gradient(120% 120% at 30% 25%, #bff0d6 0%, #6fcf9b 45%, #3fa172 100%)',
    navy:  'radial-gradient(120% 120% at 30% 25%, #8ea7d6 0%, #3f5b8f 45%, #1B2D4F 100%)',
    glass: 'radial-gradient(120% 120% at 30% 25%, rgba(255,255,255,.9) 0%, rgba(255,255,255,.35) 40%, rgba(255,255,255,.08) 100%)',
  };
  return (
    <div
      className={'relative grid shrink-0 place-items-center rounded-[28%] ' + className}
      style={{
        width: size, height: size, background: tones[tone] || tones.coral,
        boxShadow: '0 10px 24px -8px rgba(27,45,79,.45), inset 0 2px 4px rgba(255,255,255,.55), inset 0 -6px 10px rgba(0,0,0,.12)',
      }}
    >
      <div className="absolute left-[14%] top-[10%] h-[28%] w-[44%] rounded-full"
           style={{ background: 'linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0))', filter: 'blur(1px)' }} />
      <span aria-hidden="true" style={{ fontSize: size * 0.5, lineHeight: 1, filter: 'drop-shadow(0 2px 2px rgba(0,0,0,.18))' }}>{children}</span>
    </div>
  );
}

function Button({ children, onClick, variant = 'coral', disabled = false, className = '', type = 'button' }) {
  const base = 'w-full min-h-[48px] rounded-xl font-medium text-[16px] flex items-center justify-center gap-2 transition active:scale-[.98] select-none';
  const styles = {
    coral: { className: 'text-blush shadow-[0_8px_20px_-6px_rgba(255,107,107,.6)]', style: { background: '#FF6B6B' } },
    ghost: { className: 'text-[var(--subtle)]', style: { background: 'transparent' } },
    navy:  { className: 'text-blush', style: { background: 'var(--navy)' } },
    outline:{ className: 'text-coral', style: { background: 'transparent', border: '1.5px solid #FF6B6B' } },
  }[variant];
  return (
    <button type={type} onClick={onClick} disabled={disabled}
      className={base + ' ' + styles.className + ' ' + (disabled ? 'opacity-40 pointer-events-none ' : '') + className}
      style={styles.style}>
      {children}
    </button>
  );
}

// Tappable cards behave like buttons for keyboard and screen reader users too.
function Card({ children, className = '', style = {}, onClick, label }) {
  const interactive = onClick ? {
    role: 'button', tabIndex: 0, 'aria-label': label,
    onKeyDown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); } },
  } : {};
  return (
    <div onClick={onClick} {...interactive}
      className={'rounded-2xl border p-4 ' + (onClick ? 'cursor-pointer active:scale-[.99] transition ' : '') + className}
      style={{ background: 'var(--card)', borderColor: 'var(--border)', boxShadow: '0 6px 22px -10px rgba(27,45,79,.18)', ...style }}>
      {children}
    </div>
  );
}

function H1({ children, className = '' }) {
  return <h1 className={'font-serif font-semibold leading-tight tracking-tight ' + className} style={{ color: 'var(--text)' }}>{children}</h1>;
}

function ScreenHeader({ title, onBack }) {
  return (
    <div className="flex items-center gap-3 px-5 pt-12 pb-3">
      {onBack && (
        <button onClick={onBack} aria-label="Back"
          className="grid h-10 w-10 place-items-center rounded-full"
          style={{ background: 'var(--soft)', color: 'var(--text)' }}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
      )}
      <h2 className="font-serif text-[26px] font-semibold" style={{ color: 'var(--text)' }}>{title}</h2>
    </div>
  );
}

// Keeps only digits and up to two decimal places.
const cleanAmount = (raw) => {
  const [int, ...dec] = raw.replace(/[^0-9.]/g, '').split('.');
  return dec.length ? int + '.' + dec.join('').slice(0, 2) : int;
};

// SGD amount field with preset chips (used by Save, Invest and Goals).
function AmountInput({ value, onChange, presets = [], autoFocus = false, label = 'Amount in SGD' }) {
  return (
    <div>
      <div className="flex items-center gap-2 rounded-xl px-4 py-4"
        style={{ background: 'var(--card)', border: '2px solid #FF6B6B' }}>
        <span className="num text-[22px]" style={{ color: 'var(--subtle)' }}>SGD</span>
        <input inputMode="decimal" autoFocus={autoFocus} value={value} aria-label={label}
          onChange={(e) => onChange(cleanAmount(e.target.value))}
          placeholder="0.00"
          className="num w-full min-w-0 bg-transparent text-[28px] outline-none"
          style={{ color: 'var(--text)' }} />
      </div>
      {presets.length > 0 && (
        <div className="mt-4 grid gap-2.5" style={{ gridTemplateColumns: `repeat(${presets.length}, minmax(0, 1fr))` }}>
          {presets.map((p) => {
            const on = Number(value) === p;
            return (
              <button key={p} onClick={() => onChange(String(p))} aria-pressed={on}
                className="num rounded-xl py-3 text-[15px] font-medium transition active:scale-95"
                style={{ background: on ? '#FF6B6B' : 'var(--card)', color: on ? '#FFF8F5' : 'var(--text)',
                         border: '1px solid var(--border)' }}>
                SGD {p.toLocaleString('en-SG')}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Hint({ children, warn = false }) {
  return (
    <p className="mt-3 text-[13px]" role={warn ? 'alert' : undefined}
      style={{ color: warn ? '#FF6B6B' : 'var(--subtle)' }}>{children}</p>
  );
}

/* ---------- Activity ---------- */
const ACTIVITY_ICON = { deposit: '🏦', save: '💰', invest: '🌸', goal: '🎯' };

function ActivityRow({ item }) {
  const signed = item.type === 'deposit' ? '+' : item.type === 'goal' ? '' : '−';
  return (
    <div className="flex items-center gap-3 py-2.5">
      <IconBubble size={38} tone={item.type === 'invest' ? 'leaf' : item.type === 'deposit' ? 'navy' : 'coral'}>
        {ACTIVITY_ICON[item.type] || '•'}
      </IconBubble>
      <div className="min-w-0 flex-1">
        <p className="truncate text-[14px] font-medium" style={{ color: 'var(--text)' }}>{item.label}</p>
        <p className="text-[12px]" style={{ color: 'var(--subtle)' }}>{when(item.at)}</p>
      </div>
      {item.type !== 'goal' && (
        <p className="num text-[14px]" style={{ color: signed === '+' ? '#4CAF82' : 'var(--text)' }}>
          {signed}SGD {fmt(item.amount)}
        </p>
      )}
    </div>
  );
}

/* ---------- Garden ---------- */
function Garden({ flowers, big = false }) {
  const items = ['🌱', ...flowers]; // the seed stays as the garden's starting point
  const sz = big ? 'text-[40px]' : 'text-[30px]';
  return (
    <div className="flex flex-wrap gap-1.5" role="img" aria-label={`Garden with ${flowers.length} ${flowers.length === 1 ? 'flower' : 'flowers'}`}>
      {items.map((f, i) => (
        <motion.span key={i} className={sz} aria-hidden="true"
          initial={{ scale: 0, y: 8 }} animate={{ scale: 1, y: 0 }}
          transition={{ type: 'spring', stiffness: 320, damping: 16, delay: i * 0.05 }}
          style={{ filter: 'drop-shadow(0 3px 4px rgba(0,0,0,.18))' }}>{f}</motion.span>
      ))}
    </div>
  );
}

function GardenTile({ onClick }) {
  const { flowers } = useApp();
  const count = flowers.length;
  return (
    <Card onClick={onClick} label="Open your garden" className="overflow-hidden" style={{ background: '#4CAF82', borderColor: 'transparent' }}>
      <div className="flex items-start justify-between">
        <div>
          <p className="font-serif text-[19px] font-semibold text-white">Your Garden</p>
          <p className="mt-0.5 text-[13px] text-white/85">
            {count === 0 ? 'Plant your next flower. Start with SGD 50.' : `${count} ${count === 1 ? 'bloom' : 'blooms'} and growing.`}
          </p>
        </div>
        <span className="shrink-0 whitespace-nowrap rounded-full bg-white/20 px-2.5 py-1 text-[12px] font-medium text-white">🌿 {count}</span>
      </div>
      <div className="mt-3 rounded-xl bg-white/15 p-3">
        <Garden flowers={flowers} />
      </div>
    </Card>
  );
}

/* ---------- Confetti ---------- */
function Confetti({ run }) {
  const reduced = useReducedMotion();
  const pieces = useMemo(() => Array.from({ length: 28 }).map((_, i) => ({
    id: i,
    x: (Math.random() * 2 - 1) * 150,
    rot: Math.random() * 540 - 270,
    delay: Math.random() * 0.25,
    color: Math.random() > 0.5 ? '#FF6B6B' : '#4CAF82',
    size: 7 + Math.random() * 8,
    round: Math.random() > 0.5,
  })), []);
  if (!run || reduced) return null;
  return (
    <div className="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
      {pieces.map((p) => (
        <motion.div key={p.id}
          className="absolute left-1/2 top-[38%]"
          initial={{ x: 0, y: 0, opacity: 1, rotate: 0 }}
          animate={{ x: p.x, y: 360, opacity: [1, 1, 0], rotate: p.rot }}
          transition={{ duration: 1.5, delay: p.delay, ease: 'easeOut' }}
          style={{ width: p.size, height: p.size, background: p.color, borderRadius: p.round ? '50%' : '2px' }} />
      ))}
    </div>
  );
}

/* ---------- Bottom navigation ---------- */
const TAB_ICONS = {
  home: <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />,
  save: <><path d="M8 3h8M7 6h10" /><path d="M7 6a3 3 0 0 0-2 3v9a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3V9a3 3 0 0 0-2-3" /><path d="M10 13h4" /></>,
  invest: <><path d="M12 21v-9" /><path d="M12 12C12 8 9 5 4 5c0 4 3 7 8 7z" /><path d="M12 14c0-3 2.5-6 7-6 0 3.5-2.5 6-7 6z" /></>,
  learn: <><path d="M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z" /><path d="M8 7h8" /></>,
  settings: <><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-6 8-6s8 2 8 6" /></>,
};
const TABS = [
  { key: 'home',   label: 'Home' },
  { key: 'save',   label: 'Save' },
  { key: 'invest', label: 'Invest' },
  { key: 'learn',  label: 'Learn' },
  { key: 'settings', label: 'You' },
];

function BottomNav() {
  const { current, goTab } = useApp();
  return (
    <nav aria-label="Main" className="absolute bottom-0 left-0 right-0 z-30"
      style={{ background: 'var(--navy)', boxShadow: '0 -8px 24px -12px rgba(0,0,0,.4)' }}>
      <div className="mx-auto grid max-w-[420px] grid-cols-5 px-2 pt-2"
        style={{ paddingBottom: 'max(8px, var(--safe-bottom, 0px))' }}>
        {TABS.map((t) => {
          const active = current.tab === t.key;
          return (
            <button key={t.key} onClick={() => goTab(t.key)} aria-current={active ? 'page' : undefined}
              className="flex flex-col items-center gap-1 rounded-lg py-1.5"
              style={{ color: active ? '#FF6B6B' : '#7A8899' }}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"
                strokeWidth={active ? 2.2 : 1.8} strokeLinecap="round" strokeLinejoin="round"
                style={{ transform: active ? 'translateY(-1px)' : 'none', transition: 'transform .2s' }}>
                {TAB_ICONS[t.key]}
              </svg>
              <span className="text-[10px] font-medium">{t.label}</span>
            </button>
          );
        })}
      </div>
    </nav>
  );
}

/* ---------- Overlays ---------- */
function Toast({ children, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2200); return () => clearTimeout(t); }, []);
  return (
    <motion.div role="status" aria-live="polite"
      initial={{ x: '-50%', y: 60, opacity: 0 }} animate={{ x: '-50%', y: 0, opacity: 1 }} exit={{ x: '-50%', y: 60, opacity: 0 }}
      className="absolute left-1/2 z-40 whitespace-nowrap rounded-full px-4 py-2.5 text-[13px]"
      style={{ bottom: 'calc(var(--safe-bottom, 0px) + 84px)', background: 'var(--text)', color: 'var(--bg)',
               boxShadow: '0 10px 30px -8px rgba(0,0,0,.5)' }}>
      {children}
    </motion.div>
  );
}

// Rendered into the screen-level overlay layer so it sits above the bottom nav.
function Sheet({ title, onClose, children }) {
  const { overlayEl } = useApp();
  useEffect(() => {
    const onKey = (e) => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  if (!overlayEl) return null;
  return ReactDOM.createPortal(
    <div className="pointer-events-auto absolute inset-0" role="dialog" aria-modal="true" aria-label={title}>
      <motion.div className="absolute inset-0 bg-black/40" onClick={onClose}
        initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} />
      <motion.div className="absolute bottom-0 left-0 right-0 rounded-t-3xl px-5 pt-3 pb-safe"
        style={{ background: 'var(--card)' }}
        initial={{ y: '100%' }} animate={{ y: 0 }} exit={{ y: '100%' }}
        transition={{ type: 'spring', stiffness: 380, damping: 36 }}>
        <div className="mx-auto mb-3 h-1.5 w-10 rounded-full" style={{ background: 'var(--border)' }} />
        <div className="mb-1 flex items-center justify-between">
          <p className="font-serif text-[20px] font-semibold" style={{ color: 'var(--text)' }}>{title}</p>
          <button onClick={onClose} autoFocus className="rounded-full px-3 py-1.5 text-[13px] font-medium"
            style={{ background: 'var(--soft)', color: 'var(--text)' }}>Close</button>
        </div>
        {children}
      </motion.div>
    </div>,
    overlayEl,
  );
}

/* ======================================================================
   SCREENS
====================================================================== */

/* ---- Onboarding ---- */
function Splash() {
  const { resetTo } = useApp();
  useEffect(() => { const t = setTimeout(() => resetTo('welcome'), 2000); return () => clearTimeout(t); }, []);
  return (
    <div className="flex h-full flex-col items-center justify-center" style={{ background: '#1B2D4F' }}>
      <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.6 }}
        className="flex flex-col items-center">
        <span className="font-serif text-[58px] font-semibold tracking-[0.14em] mr-[-0.14em] text-blush">VELA</span>
        <motion.div className="mt-2 h-[3px] rounded-full bg-coral"
          initial={{ width: 0 }} animate={{ width: 132 }} transition={{ duration: 0.9, delay: 0.4, ease: 'easeOut' }} />
        <motion.p initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 0.9 }}
          className="mt-5 text-[15px] text-blush/75">Your money, moving.</motion.p>
      </motion.div>

  );

    const t1 = setTimeout(() => setStage(1), 250);

    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);
  return (
    <div className="relative flex h-full flex-col overflow-hidden" style={{ background: '#0D1B2A' }}>
      <Confetti run={stage >= 2 && !INSTANT} />

              transition={{ type: 'spring', stiffness: 260, damping: 12, duration: 0.6 }}

      </div>

        className="px-7 pb-safe text-center">

/* ======================================================================

====================================================================== */
const SCREEN_W = 390, SCREEN_H = 844, BEZEL = 12;
const DEVICE_W = SCREEN_W + BEZEL * 2, DEVICE_H = SCREEN_H + BEZEL * 2;
const FRAME_QUERY = '(min-width: 600px) and (min-height: 640px)';

function useFrameMode() {
  const forced = BOOT.frame === '0' ? false : BOOT.frame === '1' ? true : null;
  const [on, setOn] = useState(() => forced ?? window.matchMedia(FRAME_QUERY).matches);
  useEffect(() => {
    if (forced !== null) return;
    const mq = window.matchMedia(FRAME_QUERY);
    const onChange = (e) => setOn(e.matches);
    mq.addEventListener('change', onChange);
    return () => mq.removeEventListener('change', onChange);
  }, []);
  return on;
}

// Scale the whole device so it always fits the browser window; the screen inside stays 390x844.
function useFitScale() {
  const calc = () => Math.min(1, (window.innerHeight - 72) / DEVICE_H, (window.innerWidth - 32) / DEVICE_W);
  const [scale, setScale] = useState(calc);
  useEffect(() => {
    const onResize = () => setScale(calc());
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return scale;
}

/* ======================================================================
   ROUTER / APP SHELL
====================================================================== */

// Which tab a screen belongs to (drives bottom nav highlight & presence).
const SCREEN_TAB = {
  home: 'home',
  save: 'save', addMoney: 'save', saveConfirm: 'save', setGoal: 'save',
  invest: 'invest', investConfirm: 'invest', investSuccess: 'invest',
  learn: 'learn', learnArticle: 'learn',
  settings: 'settings', retakeRisk: 'settings',
};
const ONBOARDING = ['splash', 'welcome', 'risk', 'name', 'gardenIntro'];
// Modal-style flow screens: they own the full height (their own back/exit CTA), no bottom nav.
const NAV_HIDDEN = ['addMoney', 'saveConfirm', 'setGoal', 'investConfirm', 'investSuccess', 'retakeRisk'];
// Screens with a dark or coloured top edge get a light status bar in the phone frame.
const DARK_TOP = ['splash', 'gardenIntro', 'home', 'saveConfirm', 'investSuccess'];

// Optional deep links for demos and docs screenshots, e.g. #screen=investSuccess&flowers=1
// (also reads ?frame=0 from the query string).
const BOOT = (() => {
  const p = {};
  const parts = [window.location.search.replace(/^\?/, ''), window.location.hash.replace(/^#/, '')];
  parts.join('&').split('&').forEach((kv) => {
    const [k, v] = kv.split('=');
    if (k) p[k] = decodeURIComponent(v || '');
  });
  return p;
})();
const BOOT_SCREEN = (BOOT.screen && (SCREEN_TAB[BOOT.screen] || ONBOARDING.includes(BOOT.screen))) ? BOOT.screen : null;
// Deep-linked boots render their end state at once (used for docs screenshots).
const INSTANT = !!BOOT_SCREEN;
// In-app navigation writes #/<screen> so a refresh can come back to the same tab.
const ROUTE = window.location.hash.startsWith('#/') ? window.location.hash.slice(2) : null;

// Saved demo state. Deep links ignore it (and don't write it) so screenshots stay deterministic.
const STORE_KEY = 'vela:v1';
const SAVED = (() => {
  if (INSTANT) return null;
  try { return JSON.parse(window.localStorage.getItem(STORE_KEY)) || null; } catch (e) { return null; }
})();

const bootGoal = () => {
  if (!BOOT.goal) return null;
  const [gName, gTarget] = BOOT.goal.split(':');
  return gName && Number(gTarget) > 0 ? { name: gName, target: Number(gTarget) } : null;
};
const seedActivity = () => [
  { id: 'seed', type: 'deposit', label: 'Salary from your bank', amount: 1240, at: Date.now() - 3 * 864e5 },
];

function initialStack() {
  if (BOOT_SCREEN) return [{ screen: BOOT_SCREEN, params: { amt: Number(BOOT.amt) || undefined, id: BOOT.id } }];
  if (SAVED && SAVED.onboarded) {
    const tab = TABS.some((t) => t.key === ROUTE) ? ROUTE : 'home';
    return [{ screen: tab, params: {} }];
  }
  return [{ screen: 'splash', params: {} }];
}

function renderScreen(screen, params) {
  switch (screen) {
    case 'splash': return <Splash />;
    case 'welcome': return <Welcome />;
    case 'risk': return <RiskQuestion />;
    case 'retakeRisk': return <RiskQuestion retake />;
    case 'name': return <NameInput />;
    case 'gardenIntro': return <GardenIntro />;
    case 'home': return <Home />;
    case 'save': return <SaveHome />;
    case 'addMoney': return <AddMoney />;
    case 'setGoal': return <SetGoal />;
    case 'saveConfirm': return <SaveConfirm amt={params.amt} />;
    case 'invest': return <InvestHome />;
    case 'investConfirm': return <InvestConfirm />;
    case 'investSuccess': return <InvestSuccess amt={params.amt} />;
    case 'learn': return <LearnHome />;
    case 'learnArticle': return <LearnArticle id={params.id} />;
    case 'settings': return <Settings />;
    default: return <Home />;
  }
}

function App() {
  const S = SAVED || {};
  const bootFlowers = FLOWERS.slice(0, parseInt(BOOT.flowers, 10) || 0);
  // Persistent app state (mocked demo data, optionally seeded via BOOT deep link)
  const [name, setName] = useState(S.name || BOOT.name || 'Maya');
  const [balance, setBalance] = useState(S.balance ?? 1240.0);
  const [savings, setSavings] = useState(S.savings ?? 320.0);
  const [risk, setRisk] = useState(RISKS[S.risk] ? S.risk : RISKS[BOOT.risk] ? BOOT.risk : 'fox');
  const [flowers, setFlowers] = useState(S.flowers || bootFlowers);
  const [invested, setInvested] = useState(S.invested ?? bootFlowers.length * 50);
  const [theme, setTheme] = useState(THEMES[S.theme] ? S.theme : THEMES[BOOT.theme] ? BOOT.theme : 'light');
  const [goal, setGoal] = useState(S.goal !== undefined ? S.goal : bootGoal());
  const [activity, setActivity] = useState(S.activity || seedActivity);
  const [seenAt, setSeenAt] = useState(S.seenAt || 0);
  const [onboarded, setOnboarded] = useState(!!S.onboarded);
  const frame = useFrameMode();
  const [overlayEl, setOverlayEl] = useState(null);

  useEffect(() => {
    if (INSTANT) return;
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify({
        name, balance, savings, risk, flowers, invested, theme, goal, activity, seenAt, onboarded,
      }));
    } catch (e) { /* private mode or storage blocked: the demo still works, it just won't remember */ }
  }, [name, balance, savings, risk, flowers, invested, theme, goal, activity, seenAt, onboarded]);

  // Navigation stack, mirrored into browser history so the back button stays inside the app.
  // Each history entry carries a snapshot of the stack; popstate restores it.
  const [stack, setStack] = useState(initialStack);
  const [dir, setDir] = useState(1);
  const stackRef = useRef(stack);
  const seqRef = useRef(0);
  const onboardedRef = useRef(onboarded);
  onboardedRef.current = onboarded;

  const commit = useCallback((next, direction, mode = 'push') => {
    stackRef.current = next;
    setDir(direction);
    setStack(next);
    if (mode === 'push') seqRef.current += 1;
    const top = next[next.length - 1].screen;
    try { window.history[mode === 'push' ? 'pushState' : 'replaceState']({ vela: true, stack: next, seq: seqRef.current }, '', '#/' + top); } catch (e) {}
  }, []);

  useEffect(() => {
    // Tag the entry we booted on (deep links keep their URL so a refresh reproduces them).
    // After a refresh, keep the entry's position so back/forward animations still point the right way.
    const prev = window.history.state;
    seqRef.current = prev && prev.vela ? prev.seq : 0;
    try { window.history.replaceState({ vela: true, stack: stackRef.current, seq: seqRef.current }, '', INSTANT ? undefined : '#/' + stackRef.current[0].screen); } catch (e) {}
    const onPop = (e) => {
      const st = e.state;
      if (!st || !st.vela) return;
      let next = st.stack;
      // Once onboarded, don't let the back button drop you into the onboarding screens again.
      if (onboardedRef.current && ONBOARDING.includes(next[next.length - 1].screen)) {
        next = [{ screen: 'home', params: {} }];
        try { window.history.replaceState({ ...st, stack: next }, '', '#/home'); } catch (err) {}
      }
      setDir(st.seq < seqRef.current ? -1 : 1);
      seqRef.current = st.seq;
      stackRef.current = next;
      setStack(next);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const current = stack[stack.length - 1];
  const tab = SCREEN_TAB[current.screen] || null;
  const showNav = tab !== null && !ONBOARDING.includes(current.screen) && !NAV_HIDDEN.includes(current.screen);

  const navigate = useCallback((screen, direction = 1, params = {}) => {
    commit([...stackRef.current, { screen, params }], direction);
  }, [commit]);
  const back = useCallback(() => {
    const s = stackRef.current;
    if (s.length > 1 && window.history.state && window.history.state.vela) window.history.back();
    else commit(s.length > 1 ? s.slice(0, -1) : [{ screen: SCREEN_TAB[s[0].screen] || 'home', params: {} }], -1, 'replace');
  }, [commit]);
  const goTab = useCallback((tabKey) => commit([{ screen: tabKey, params: {} }], 1), [commit]);
  const resetTo = useCallback((screen) => commit([{ screen, params: {} }], 1, 'replace'), [commit]);
  const finishOnboarding = useCallback(() => { setOnboarded(true); commit([{ screen: 'home', params: {} }], 1, 'replace'); }, [commit]);

  const log = (type, label, amount) =>
    setActivity((a) => [{ id: Date.now() + '-' + a.length, type, label, amount, at: Date.now() }, ...a].slice(0, 30));
  const addToSavings = useCallback((amt) => {
    setSavings((s) => s + amt); setBalance((b) => b - amt);
    log('save', 'Moved to your Savings Pot', amt);
  }, []);
  const plantFlower = useCallback((amt) => {
    setFlowers((f) => [...f, FLOWERS[f.length % FLOWERS.length]]);
    setBalance((b) => b - amt); setInvested((i) => i + amt);
    log('invest', 'Planted a flower', amt);
  }, []);
  const setGoalTo = useCallback((g) => {
    setGoal(g);
    if (g) log('goal', `Goal set: ${g.name}`, g.target);
  }, []);
  const markSeen = useCallback(() => setSeenAt(Date.now()), []);
  const resetDemo = useCallback(() => {
    try { window.localStorage.removeItem(STORE_KEY); } catch (e) {}
    window.location.replace(window.location.pathname + window.location.search);
  }, []);

  const ctx = {
    name, setName, balance, savings, addToSavings, risk, setRisk, flowers, plantFlower, invested,
    goal, setGoalTo, activity, seenAt, markSeen, overlayEl, theme, setTheme, current: { ...current, tab },
    navigate, back, goTab, resetTo, finishOnboarding, resetDemo,
  };

  const variants = {
    enter: (d) => ({ x: d > 0 ? '100%' : '-100%', opacity: 0.6 }),
    center: { x: 0, opacity: 1 },
    exit: (d) => ({ x: d > 0 ? '-30%' : '30%', opacity: 0 }),
  };

  const screen = (
    <div className={'relative w-full overflow-hidden ' + (frame ? 'h-full' : 'h-[100dvh] max-w-[420px]')}
      style={{ ...THEMES[theme].vars, '--safe-bottom': frame ? '34px' : 'env(safe-area-inset-bottom, 0px)', background: 'var(--bg)' }}>
      <AnimatePresence custom={dir} mode="wait" initial={false}>
        <motion.div key={current.screen + JSON.stringify(current.params)}
          custom={dir} variants={variants} initial="enter" animate="center" exit="exit"
          transition={{ type: 'tween', duration: 0.28, ease: [0.4, 0, 0.2, 1] }}
          className="absolute inset-0">
          {renderScreen(current.screen, current.params)}
        </motion.div>
      </AnimatePresence>

      {showNav && <BottomNav />}
      <div ref={setOverlayEl} className="pointer-events-none absolute inset-0 z-40" />
    </div>
  );

  return (
    <AppCtx.Provider value={ctx}>
      <MotionConfig reducedMotion="user">
        {frame ? (
          <PhoneFrame light={theme !== 'light' || DARK_TOP.includes(current.screen)}>{screen}</PhoneFrame>
        ) : (
          <div className="flex h-full w-full items-center justify-center" style={{ background: '#0a0f17' }}>{screen}</div>
        )}
      </MotionConfig>
    </AppCtx.Provider>
  );
}

requestAnimationFrame(() => {
  const b = document.getElementById('boot');
  if (b) { b.style.opacity = '0'; setTimeout(() => b.remove(), 400); }
});
